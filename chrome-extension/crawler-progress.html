<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QAtalyst - Crawling Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 500px;
      height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: #f1f5f9;
      padding: 20px;
      overflow: hidden;
    }
    .header {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 20px;
      color: #1e293b;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
    }
    .progress-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }
    .progress-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 12px;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background: #e0f2fe;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #06b6d4);
      transition: width 0.3s ease;
      border-radius: 12px;
    }
    .progress-percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0369a1;
      font-weight: 600;
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }
    .progress-details {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
    }
    .progress-detail {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .progress-detail-label {
      font-weight: 500;
      color: #64748b;
    }
    .progress-detail-value {
      font-weight: 600;
      color: #1e293b;
    }
    .status-message {
      background: white;
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .status-message.crawling {
      background: #f0f9ff;
      border-color: #bae6fd;
      color: #0369a1;
    }
    .status-message.complete {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }
    .status-message.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #dc2626;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e0f2fe;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .action-buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-close {
      background: #64748b;
      color: white;
    }
    .btn-close:hover {
      background: #475569;
    }
    .btn-close:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .current-url {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🕷️ Web Application Crawl</h1>
    <p class="subtitle">This window will stay open while crawling</p>
  </div>

  <div id="statusMessage" class="status-message crawling">
    <span class="spinner"></span>
    Initializing crawler...
  </div>

  <div class="progress-container">
    <div class="progress-title">Crawl Progress</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      <div class="progress-percentage" id="progressPercentage">0%</div>
    </div>
    <div class="progress-details">
      <div class="progress-detail">
        <span class="progress-detail-label">Pages Crawled:</span>
        <span class="progress-detail-value" id="pagesCrawled">0 / 0</span>
      </div>
      <div class="progress-detail">
        <span class="progress-detail-label">Features Found:</span>
        <span class="progress-detail-value" id="featuresFound">0</span>
      </div>
      <div class="progress-detail">
        <span class="progress-detail-label">API Endpoints:</span>
        <span class="progress-detail-value" id="apisFound">0</span>
      </div>
    </div>
    <div class="current-url" id="currentUrl">Waiting to start...</div>
  </div>

  <div class="action-buttons">
    <button class="btn btn-close" id="closeBtn" disabled>Close Window</button>
  </div>

  <script src="crawler-progress.js"></script>
</body>
</html>
